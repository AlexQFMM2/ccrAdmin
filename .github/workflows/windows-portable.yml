name: Windows Portable Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-deployment:
    name: Validate Docker deployment files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment script
        run: bash -n deploy/ccr/deploy.sh

      - name: Validate Compose configuration
        working-directory: deploy/ccr
        run: docker compose --env-file .env.example config --quiet

  build-windows:
    name: Build Windows x64 portable package
    runs-on: windows-latest
    needs: validate-deployment

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name ccrAdmin `
            main.py

      - name: Create portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path release\ccrAdmin | Out-Null
          Copy-Item dist\ccrAdmin.exe release\ccrAdmin\ccrAdmin.exe
          Copy-Item README.md release\ccrAdmin\README.md
          Copy-Item "新电脑接入_myModels_CCR_指南.md" release\ccrAdmin\
          New-Item -ItemType Directory -Force -Path release\ccrAdmin\deploy | Out-Null
          Copy-Item deploy\ccr release\ccrAdmin\deploy\ccr -Recurse
          Compress-Archive `
            -Path release\ccrAdmin\* `
            -DestinationPath ccrAdmin-windows-x64.zip `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccrAdmin-windows-x64
          path: ccrAdmin-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ccrAdmin-windows-x64.zip
