name: Remove Obsolete Build

on:
  push:
    branches:
      - main

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete unsanitized workflow run
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: 30062190166,
              });
              core.info("Obsolete workflow run deleted.");
            } catch (error) {
              if (error.status === 404) {
                core.info("Obsolete workflow run is already absent.");
              } else {
                throw error;
              }
            }
